<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Original business proposals: expected impact and enterprise implementation effort</title>
  <desc id="desc">Qualitative categories, not numerical scores or A3 development hours. Francis PlanFit, Xuan Knowledge Handover and Ryan conditional Fibre Handoff share exactly the same range: High effort, Medium–High impact. Rae original annual Plan Review Snapshot has Medium–High effort and Medium–High impact. Rae's rectangle overlaps the shared vertical range. All positions are provisional analysis, not team votes or validated effects.</desc>
  <rect width="1120" height="700" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b42">
    <text x="46" y="38" font-size="24" font-weight="bold">Effort–Impact Matrix</text>
    <text x="46" y="67" font-size="17">Original business proposals — NOT A3 development effort or Billing Review Lite scope</text>
    <text x="46" y="92" font-size="16">Provisional analytical ranges • expected effects, not achieved benefits • team confirmation pending</text>
    <rect x="170" y="120" width="570" height="420" fill="#f7f9fb" stroke="#526579" stroke-width="1.5"/>
    <path d="M360 120V540 M550 120V540 M170 260H740 M170 400H740" stroke="#b0bbc6" stroke-width="1"/>
    <g font-size="18" text-anchor="middle">
      <text x="265" y="571">Low</text><text x="455" y="571">Medium</text><text x="645" y="571">High</text>
    </g>
    <g font-size="18" text-anchor="end">
      <text x="150" y="197">High</text><text x="150" y="337">Medium</text><text x="150" y="477">Low</text>
    </g>
    <text x="455" y="609" font-size="19" text-anchor="middle" font-weight="bold">Enterprise implementation effort →</text>
    <text transform="translate(42 332) rotate(-90)" font-size="19" text-anchor="middle" font-weight="bold">Expected business impact →</text>
    <rect x="455" y="190" width="190" height="140" fill="#deedf8" fill-opacity="0.7" stroke="#285d80" stroke-width="3" stroke-dasharray="9 5"/>
    <path d="M645 190V330 M634 190H656 M634 330H656" stroke="#172b42" stroke-width="5" fill="none"/>
    <path d="M645 225H775" stroke="#172b42" stroke-width="1.5" fill="none"/>
    <g font-size="17">
      <text x="790" y="175" font-weight="bold">Shared range (one position):</text>
      <text x="790" y="203">Francis — PlanFit</text>
      <text x="790" y="231">Xuan — Knowledge Handover</text>
      <text x="790" y="259">Ryan — conditional Fibre Handoff</text>
      <text x="790" y="292">Effort High; Impact Medium–High</text>
      <path d="M455 310H415V435H775" stroke="#285d80" stroke-width="1.5" fill="none"/>
      <text x="790" y="405" font-weight="bold">Dashed rectangle: Rae</text>
      <text x="790" y="433">Original annual Plan Review Snapshot</text>
      <text x="790" y="461">Effort Medium–High;</text>
      <text x="790" y="489">Impact Medium–High</text>
    </g>
    <text x="170" y="648" font-size="16">Line / rectangle endpoints span category centres; no precise score is implied. Overlap is intentional.</text>
    <text x="170" y="674" font-size="16">Evidence confidence is separate. Definitions, sources and text equivalent: A3_Candidate_Comparison.md §§2–4.</text>
  </g>
</svg>
